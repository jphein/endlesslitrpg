[package]
name = "litrpg-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "litrpg command line: prompt editing, director notes, status, cast, rewind"

[[bin]]
name = "litrpg"
path = "src/main.rs"

[dependencies]
litrpg-core = { workspace = true }
litrpg-store = { workspace = true }
litrpg-config = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
