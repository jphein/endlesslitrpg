[package]
name = "litrpg-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP surface for endless-litrpg: chapter API, Range-capable PCM, RSS feed, realm-sigil version"

[lib]
name = "litrpg_daemon"
path = "src/lib.rs"

[[bin]]
name = "litrpg-daemon"
path = "src/main.rs"

[features]
# Off by default, matching `litrpg-tts`: a plain build must not link sherpa-onnx.
# Declared as a passthrough so `cfg!(feature = "sherpa")` in `voices.rs` is meaningful
# — without it, that check would silently always be false and `/api/voices` could not
# tell "not compiled in" from "no models on disk".
default = []
sherpa = ["litrpg-tts/sherpa"]

[dependencies]
litrpg-core = { workspace = true }
litrpg-store = { workspace = true }
litrpg-config = { workspace = true }
# Default features on purpose — **no `sherpa`**. The voice catalog is config-derived
# (`SherpaConfig` is always compiled; only the worker pool is behind the feature), so
# `/api/voices` can advertise sherpa without this daemon linking native TTS libraries.
litrpg-tts = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true, features = ["fs", "trace"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
# `ReaderStream` — the adapter that turns a seeked `tokio::fs::File` into an
# `axum::body::Body` without buffering. Not in `workspace.dependencies`, and adding
# it there would mean editing the workspace root, which this crate is not permitted
# to touch; pinned explicitly here instead. Already in `Cargo.lock` at 0.7.19 via
# tower-http's `fs` feature, so this adds no new transitive weight.
tokio-util = { version = "0.7.19", features = ["io"] }

[dev-dependencies]
# `ServiceExt::oneshot` — drives the router in-process, no socket bound.
tower = { version = "0.5.3", features = ["util"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }
